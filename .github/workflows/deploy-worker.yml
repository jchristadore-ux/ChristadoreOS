name: Deploy bank worker

# Only runs when the worker itself changes, so ordinary site pushes are
# untouched. workflow_dispatch is there for the first deploy and for re-runs.
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      # wrangler's own message for a missing token is a wall of prose about
      # non-interactive environments. Fail earlier and say what to fix.
      - name: Check required secrets
        env:
          # "Cloudflare" is easy to type as "Cloudfare", and GitHub shows an API
          # token only once — so a misspelled secret cannot simply be retyped
          # under the right name. Accept either spelling rather than making the
          # token be regenerated.
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFARE_API_TOKEN }}
          HOUSEHOLD_KEY: ${{ secrets.HOUSEHOLD_KEY }}
        run: |
          missing=""
          [ -z "$API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$HOUSEHOLD_KEY" ] && missing="$missing HOUSEHOLD_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo ""
            echo "Add them as SECRETS (not variables) at:"
            echo "  https://github.com/${GITHUB_REPOSITORY}/settings/secrets/actions"
            echo ""
            echo "Two things commonly go wrong:"
            echo "  1. Spelling. It is CLOUDFLARE, not CLOUDFARE."
            echo "  2. Tab. Secrets and Variables sit side by side and look the"
            echo "     same; a value under Variables is invisible to secrets.*"
            exit 1
          fi
          echo "Both secrets are present."

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFARE_API_TOKEN }}
          workingDirectory: worker
          # Pushed to the worker on every deploy, so the household key never has
          # to be set by hand in the Cloudflare dashboard.
          secrets: |
            HOUSEHOLD_KEY
        env:
          HOUSEHOLD_KEY: ${{ secrets.HOUSEHOLD_KEY }}
