name: Deploy bank worker

# Only runs when the worker itself changes, so ordinary site pushes are
# untouched. workflow_dispatch is there for the first deploy and for re-runs.
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      # wrangler's own message for a missing token is a wall of prose about
      # non-interactive environments. Fail earlier and say what to fix.
      - name: Check required secrets
        env:
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HOUSEHOLD_KEY: ${{ secrets.HOUSEHOLD_KEY }}
        run: |
          missing=""
          [ -z "$API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$HOUSEHOLD_KEY" ] && missing="$missing HOUSEHOLD_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo ""
            echo "Add them as SECRETS (not variables) at:"
            echo "  Settings -> Secrets and variables -> Actions -> Secrets tab"
            echo "  https://github.com/${GITHUB_REPOSITORY}/settings/secrets/actions"
            echo ""
            echo "The 'Secrets' and 'Variables' tabs sit next to each other on that"
            echo "page and look identical. A value added under Variables is not"
            echo "visible here, which is the usual cause of this failure."
            exit 1
          fi
          echo "Both secrets are present."

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
