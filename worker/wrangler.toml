name = "christadoreos-bank"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Created once in the Cloudflare dashboard (Storage & Databases -> KV).
# Paste the namespace ID here; it is an identifier, not a secret.
[[kv_namespaces]]
binding = "BANK"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

[vars]
# Origins allowed to call this worker. The first entry is the fallback used
# when a request arrives with no Origin header.
ALLOWED_ORIGINS = "https://jchristadore-ux.github.io,http://localhost:5173"

# HOUSEHOLD_KEY is NOT set here — it is a secret:
#   Workers & Pages -> christadoreos-bank -> Settings -> Variables -> Add secret
